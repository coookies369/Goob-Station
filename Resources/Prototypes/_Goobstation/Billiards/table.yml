- type: entity
  id: BilliardTable
  name: billiards table
  parent: BaseStructure
  placement:
    mode: AlignTileAny
  components:
    - type: Sprite
      sprite: _Goobstation/Objects/Fun/Billiards/billiard_table.rsi
      offset: 0,-0.5
      state: base
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Wood
    - type: PlaceableSurface
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-1.40625,-1.28125,1.40625,0.28125"
          density: 55
          mask: # tables should collide with other tables
            - TableMask
          layer:
            - TableLayer
            - BulletImpassable # Goobstation - Crawling
        fix2:
          shape: !type:PhysShapeAabb
            bounds: "-1.125,0.125,-0.15625,0.28125"
          density: 0
          restitution: 1.1
          layer:
            - LowImpassable
        fix3:
          shape: !type:PhysShapeAabb
            bounds: "1.125,0.125,0.15625,0.28125"
          density: 0
          restitution: 1.1
          layer:
            - LowImpassable
        fix4:
          shape: !type:PhysShapeAabb
            bounds: "-1.125,-1.125,-0.15625,-1.28125"
          density: 0
          restitution: 1.1
          layer:
            - LowImpassable
        fix5:
          shape: !type:PhysShapeAabb
            bounds: "1.125,-1.125,0.15625,-1.28125"
          density: 0
          restitution: 1.1
          layer:
            - LowImpassable
        fix6:
          shape: !type:PhysShapeAabb
            bounds: "-1.40625,-1.0,-1.25,0.0"
          density: 0
          restitution: 1.1
          layer:
            - LowImpassable
        fix7:
          shape: !type:PhysShapeAabb
            bounds: "1.40625,-1.0,1.25,0.0"
          density: 0
          restitution: 1.1
          layer:
            - LowImpassable
