- type: entity
  id: BilliardCue
  name: cue stick
  parent: BaseItem
  components:
    - type: LandAtCursor
    - type: Sprite
      sprite: _Goobstation/Objects/Fun/Billiards/billiard_cue.rsi
      state: cue
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PolygonShape
            vertices:
              - -0.08,-0.06 # Goob edit
              - -0.06,-0.08 # Goob edit
              - 0.40,0.30
              - 0.30,0.40
          density: 20
          mask:
            - ItemMask
          restitution: 0.3
          friction: 0.2
    - type: MeleeWeapon
      animationRotation: -135
      canWideSwing: false
      range: 2.2
      attackRate: 0.8
      damage:
        types:
          Blunt: 4
      soundHit:
        collection: MetalThud
    - type: ThrowingAngle
      angle: 225
    - type: DamageOtherOnHit
      damage:
        types:
          Blunt: 6
    - type: Wieldable
    - type: IncreaseDamageOnWield
      damage:
        types:
          Blunt: 2
    - type: Item
      size: Large
      shape:
        - 0,0,8,0
      storedRotation: 45
    - type: MeleeThrowOnHit
      speed: 2.0
