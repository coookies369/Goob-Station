- type: entity
  id: BilliardBallBase
  abstract: True
  parent: BaseItem
  components:
    - type: Sprite
      sprite: _Goobstation/Objects/Fun/Billiards/billiard_ball.rsi
      noRot: True
    - type: Item
      size: Tiny
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic #TODO
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.05
          mask:
            - ItemMask
            - LowImpassable
          layer:
            - LowImpassable
          restitution: 1
    - type: MovementIgnoreGravity
      gravityState: True
    - type: CollisionWake
      enabled: False

- type: entity
  id: BilliardBallCue
  name: cue ball
  parent: BilliardBallBase
  components:
    - type: Sprite
      sprite: _Goobstation/Objects/Fun/Billiards/billiard_ball.rsi
      state: cue

